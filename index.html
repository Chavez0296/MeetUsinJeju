<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meet Us in Jeju</title>
  <meta name="description" content="Eden &amp; Luis are getting married in Jeju, South Korea on April 3rd, 2027.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

<body class="page-intro">
  <main class="envelope">
    <h1 class="visually-hidden">Meet Us in Jeju — Eden &amp; Luis</h1>

    <button class="envelope__stage" type="button" aria-label="Open the invitation">
      <video class="envelope__media envelope__video"
             src="assets/video/envelope.mp4"
             poster="assets/video/envelope-poster.webp"
             playsinline preload="auto" aria-hidden="true"></video>
      <img class="envelope__media envelope__open-image"
           src="assets/img/envelope-open.webp" width="1920" height="1080" alt="" aria-hidden="true">
    </button>

    <p class="envelope__hint" aria-live="polite">
      <a class="envelope__enter" href="home.html">Enter</a>
    </p>
  </main>
